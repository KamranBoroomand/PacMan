<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PacMan">
  <meta property="og:description" content="In-browser, canvas-based Pac-Man homage. Runs fully as static assets.">
  <meta property="og:url" content="https://pacman.kamranboroomand.ir/">
  <meta property="og:image" content="https://pacman.kamranboroomand.ir/images/pacman-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PacMan">
  <meta name="twitter:description" content="In-browser, canvas-based Pac-Man homage. Fully static.">
  <meta name="twitter:image" content="https://pacman.kamranboroomand.ir/images/pacman-preview.png">
  <meta name="theme-color" content="#08131d">
  <title>PacMan Game</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/pacman favicon.png">
  <link rel="icon" type="image/png" href="images/pacman favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-layer bg-pixel" aria-hidden="true"></div>
  <div class="bg-layer bg-stars" aria-hidden="true"></div>
  <div class="bg-layer bg-flow" aria-hidden="true"></div>
  <div class="bg-layer bg-radial" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-pill">
      <div class="identity-block">
        <p class="identity-kicker">1980 Classic Rewired</p>
        <h1 class="identity-name">
          <span class="title-main">PAC-MAN</span>
        </h1>
        <p class="identity-subline">Play with keyboard, gamepad, touch, or virtual stick</p>
        <div class="header-badges" aria-label="Feature highlights">
          <span class="header-badge">60 FPS</span>
          <span class="header-badge">ARCADE AI</span>
          <span class="header-badge">PWA READY</span>
        </div>
      </div>

      <nav class="header-links" aria-label="Project links">
        <a class="header-link" href="https://github.com/KamranBoroomand/PacMan" target="_blank" rel="noopener">Source</a>
        <a class="header-link" href="https://pacman.kamranboroomand.ir/" target="_blank" rel="noopener">Production</a>
      </nav>
    </div>

    <div class="game-actions" aria-label="Game controls">
      <button id="start-game" class="action-btn" type="button">Start</button>
      <button id="pause-toggle" class="action-btn" type="button" aria-pressed="false">Pause</button>
      <button id="restart-game" class="action-btn" type="button">Restart</button>
      <button id="mute-toggle" class="action-btn" type="button" aria-pressed="false">Sound: On</button>
      <button id="arcade-view-toggle" class="action-btn desktop-only" type="button" aria-pressed="false">Arcade View</button>
      <button id="install-app" class="action-btn hidden" type="button">Install App</button>
    </div>
  </header>

  <main id="container" class="game-shell">
    <section class="canvas-shell">
      <canvas id="canvas" class="gmap"></canvas>

      <div id="touch-controls" class="touch-controls" aria-label="Touch controls">
        <button class="touch-btn touch-up" data-direction="up" aria-label="Move up" type="button">▲</button>
        <button class="touch-btn touch-left" data-direction="left" aria-label="Move left" type="button">◀</button>
        <button class="touch-btn touch-down" data-direction="down" aria-label="Move down" type="button">▼</button>
        <button class="touch-btn touch-right" data-direction="right" aria-label="Move right" type="button">▶</button>
      </div>

      <div id="virtual-stick" class="virtual-stick hidden" aria-label="Virtual stick">
        <div id="stick-base" class="stick-base">
          <div id="stick-knob" class="stick-knob"></div>
        </div>
        <p class="stick-help">Drag to steer</p>
      </div>

      <div style="display:none;">
        <img id="animation" src="images/animations.gif" alt="pacman sprites">
        <img id="ghosts" src="images/ghost.png" alt="ghost sprites">
      </div>
    </section>

    <details class="settings-panel" id="settings-panel">
      <summary>Settings</summary>
      <div class="settings-grid">
        <label class="settings-item" for="volume-control">
          <span>Volume</span>
          <input id="volume-control" type="range" min="0" max="100" step="1" value="70" />
        </label>

        <label class="settings-item" for="mobile-input-mode">
          <span>Mobile Input</span>
          <select id="mobile-input-mode">
            <option value="buttons">Buttons</option>
            <option value="stick">Virtual Stick</option>
          </select>
        </label>

        <div class="settings-item keybinds" aria-label="Key bindings">
          <span>Keybinds</span>
          <div class="keybind-grid">
            <button type="button" class="keybind-btn" data-action="left">Left: A</button>
            <button type="button" class="keybind-btn" data-action="up">Up: W</button>
            <button type="button" class="keybind-btn" data-action="right">Right: D</button>
            <button type="button" class="keybind-btn" data-action="down">Down: S</button>
            <button type="button" class="keybind-btn" data-action="pause">Pause: P</button>
            <button type="button" class="keybind-btn" data-action="restart">Restart: R</button>
            <button type="button" class="keybind-btn" data-action="mute">Mute: M</button>
            <button type="button" class="keybind-btn" data-action="start">Start: Enter</button>
          </div>
          <p id="keybind-help" class="settings-help">Click a keybind, then press a key.</p>
        </div>
      </div>
    </details>
  </main>

  <footer class="site-footer">
    <p class="footer-line">PacMan · Focus-first gameplay shell</p>
    <p class="footer-line footer-muted">Arcade motion, modern controls, and offline-ready play.</p>
  </footer>

  <script src="scripts/gameplay-utils.js" defer></script>
  <script src="scripts/pacman.js" defer></script>
  <script src="scripts/ghost.js" defer></script>
  <script src="scripts/game.js" defer></script>
</body>
</html>
