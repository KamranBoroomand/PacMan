name: Quality Checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_visual:
        description: "Run visual Playwright snapshots"
        required: false
        type: boolean
        default: false

jobs:
  quality:
    name: Lint, Unit, and E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Lint and unit tests
        run: npm run check

      - name: E2E tests (desktop + mobile matrix)
        run: npm run test:e2e

      - name: Visual snapshot tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_visual }}
        run: PLAYWRIGHT_VISUAL=1 npm run test:e2e -- --project=desktop-chromium

  site-artifact:
    name: Build Site Artifact
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle static site
        run: |
          mkdir -p site-dist
          cp -R index.html css scripts images manifest.webmanifest service-worker.js CNAME LICENSE README.md site-dist/

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacman-site
          path: site-dist
