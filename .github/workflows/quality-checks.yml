name: Quality Checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_visual:
        description: "Run visual Playwright snapshots"
        required: false
        type: boolean
        default: false
      run_lighthouse:
        description: "Run optional Lighthouse baseline budget"
        required: false
        type: boolean
        default: false

jobs:
  quality:
    name: Lint, Unit, and E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Lint and unit tests
        run: npm run check

      - name: E2E tests (desktop + mobile matrix)
        run: npm run test:e2e

      - name: Visual snapshot tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_visual }}
        run: PLAYWRIGHT_VISUAL=1 npm run test:e2e -- --project=desktop-chromium

  lighthouse:
    name: Optional Lighthouse Baseline
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_lighthouse }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/lighthouse-server.log 2>&1 &
          echo $! > /tmp/lighthouse-server.pid
          sleep 2

      - name: Lighthouse budget check
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:4173/
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/lighthouse-server.pid ]; then
            kill "$(cat /tmp/lighthouse-server.pid)" || true
          fi

  site-artifact:
    name: Build Site Artifact
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle static site
        run: |
          mkdir -p site-dist
          cp -R index.html css scripts images manifest.webmanifest service-worker.js CNAME LICENSE README.md site-dist/

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacman-site
          path: site-dist
