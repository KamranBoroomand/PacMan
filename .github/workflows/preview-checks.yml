name: Preview Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  preview-quality:
    name: Preview Lint, Unit, and E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Lint and unit tests
        run: npm run check

      - name: E2E tests
        run: npm run test:e2e

  preview-artifact:
    name: Build Preview Artifact
    runs-on: ubuntu-latest
    needs: preview-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle static site
        run: |
          mkdir -p preview-dist
          cp -R index.html css scripts images manifest.webmanifest service-worker.js CNAME LICENSE README.md preview-dist/

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacman-preview-site
          path: preview-dist
