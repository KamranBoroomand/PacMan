name: Visual Review

on:
  pull_request:
  workflow_dispatch:

jobs:
  visual:
    name: Playwright Visual Captures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Capture interface states
        run: PLAYWRIGHT_VISUAL=1 npm run test:e2e -- --project=desktop-chromium --project=mobile-chromium

      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: test-results
