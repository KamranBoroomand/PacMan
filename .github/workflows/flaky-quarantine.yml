name: Flaky Quarantine

on:
  workflow_dispatch:
    inputs:
      test_pattern:
        description: "Playwright grep pattern for quarantined tests"
        required: true
        type: string

jobs:
  quarantine:
    name: Quarantine Playwright Spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build static site
        run: npm run build

      - name: Run targeted test repeatedly
        env:
          TEST_PATTERN: ${{ inputs.test_pattern }}
        run: npx playwright test --project=desktop-chromium --grep "$TEST_PATTERN" --repeat-each=3

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-playwright-report
          path: playwright-report
